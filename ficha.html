<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCORRÊNCIAS - Registro de Estudante</title>
    <style>
       
       /* corpo do codigo css*/
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.6;
            color: #222;
            background-color: rgb(248, 242, 242);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 5px;
            border-bottom: 3px solid #000x;
            padding-bottom: 10px;
        }

        h2 {
            font-size: 16px;
            margin: 18px 0 8px 0;
        }

        .campo {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .campo label {
            min-width: 220px;
            font-weight: bold;
        }
         /* linha da ocorrencia*/ 
        .linha {
            flex: 1;
            border-bottom: 1px solid #000;
            padding-bottom: 3px;
            margin-left: 8px;
        }

        .data {
            display: inline-block;
            min-width: 180px;
            border-bottom: 1px solid #000;
            padding-bottom: 3px;
        }

        hr {
            border: 1px solid #000;
            margin: 25px 0;
        }

        .fato {
            border: 2px solid #000;
            min-height: 380px;           /* aumentei um pouco para caber mais linhas */
            padding:20px 15px;
            margin:20px 0;
            background-color: rgb(248, 242, 242)
            font-size:15px;
            line-height:1.8;
            position:relative;
            overflow:hidden;
        }

        /* Linhas horizontais dentro da área*/
        .fato:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(to bottom, transparent 0, transparent 27px, #000 27px, #000 28px);
            background-size: 100% 28px;   /* distância entre as linhas */
            pointer-events: none;
            z-index: 1;
        }

        .fato p, .fato div {
            position: relative;
            z-index: 2;
            margin: 0;
            min-height: 28px;
        }

        .assinatura {
            width: 350px;
            margin: 60px auto 8px auto;
            border-bottom: 1px solid #000;
        }

        .texto-assinatura {
            text-align: center;
            font-size: 14px;
        }

        .header-info {
            text-align: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #000;
        }

        @media print {
            body { margin: 0; padding: 15px; }
            .fato { min-height: 420px; }
            .assinatura { margin-top: 80px; } 
        }
    </style>
</head>
<body>

    <h1>OCORRÊNCIAS</h1>
    <div class="header-info">Registro de Ocorrência Escolar</div>

    <hr>

    <div class="campo">
        <label>NOME DO ESTUDANTE:</label>
        <span class="linha"></span>
    </div>

    <div class="campo">
        <label>SÉRIE / TURMA:</label>
        <span class="linha"></span>
    </div>

    <div class="campo">
        <label>CGM:</label>
        <span class="linha"></span>
    </div>

    <div class="campo">
        <label>DISCIPLINA:</label>
        <span class="linha"></span>
    </div>

    <div class="campo">
        <label>NOME DO PROFISSIONAL:</label>
        <span class="linha"></span>
    </div>

    <div class="campo">
        <label>DATA:</label>
        <span class="data">____ / ____ / ________</span>
    </div>

    <hr>

    <h2><center>FATO OBSERVADO</center></h2>
    <p style="text-align:center; font-size:13px; color:#000; margin-bottom:10px;">
        (Descrever de forma objetiva, clara e sucinta)
    </p>
   
    <div class="fato"></div>

    <div class="assinatura"></div>
    <div class="texto-assinatura">Assinatura do Profissional Responsável</div>

</body>
</html>
